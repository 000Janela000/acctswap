name: release

# A `v*` tag builds every file, publishes the GitHub release, then crates.io, PyPI and npm through
# trusted publishing (no stored tokens). Run by hand, it builds and packs everything and publishes
# nothing. The environments crates-io, pypi and npm accept only `v*` tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs. Actions are pinned to commits.
permissions: {}

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install maturin==1.15.0
      # maturin builds the program (into target/<target>/release, as cargo does) and the PyPI wheel
      # around it. The Linux program is static, so its wheel is tagged for glibc and musl systems.
      - run: >-
          maturin build --release --locked --target ${{ matrix.target }} --out wheels
          ${{ endsWith(matrix.target, '-linux-musl') && '--compatibility manylinux2014 musllinux_1_2' || '' }}
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a ../../../acctswap-${{ matrix.target }}.zip acctswap.exe
          else
            tar czf ../../../acctswap-${{ matrix.target }}.tar.gz acctswap
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acctswap-${{ matrix.target }}
          path: acctswap-${{ matrix.target }}.*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.target }}
          path: wheels/*.whl

  # Checks the tag against Cargo.toml, packs the npm packages and dry-runs the crates, so a run by
  # hand tests all of it before a tag.
  packages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - id: version
        run: |
          v=$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "acctswap") | .version')
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "the tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($v)" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - run: cargo publish --dry-run --locked --workspace
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acctswap-*
          merge-multiple: true
          path: archives
      - run: node scripts/npm-packages.mjs "${{ steps.version.outputs.version }}" archives npm-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: npm-packages

  release:
    needs: [build, packages]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      id-token: write # signing the attestation
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acctswap-*
          merge-multiple: true
      - run: sha256sum acctswap-* > SHA256SUMS
      # A signed record of which workflow and commit built each file:
      # gh attestation verify <file> -R <owner>/<repo>
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: SHA256SUMS
      # Immutable releases: the files go up while the release is a draft, then it is published
      # and can no longer change.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: |
            acctswap-*
            SHA256SUMS
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  # The registry jobs skip a version that is already up, so re-running a failed job finishes the rest.
  crates-io:
    needs: release
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # The core first: cargo waits until it is in the index before the program needs it.
      - run: |
          v=${GITHUB_REF_NAME#v}
          for c in acctswap-core acctswap; do
            if curl -sf -A "acctswap-release (github.com/$GITHUB_REPOSITORY)" "https://crates.io/api/v1/crates/$c/$v" > /dev/null; then
              echo "$c $v is already on crates.io"
            else
              cargo publish --locked -p "$c"
            fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # trusted publishing and attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  npm:
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-packages
          path: npm-packages
      # The system packages first, so `acctswap` never names a version that is not there yet.
      - run: |
          v=${GITHUB_REF_NAME#v}
          while read -r file name; do
            if [ -n "$(npm view "$name@$v" version 2> /dev/null)" ]; then
              echo "$name $v is already on npm"
            else
              npm publish "npm-packages/$file" --access public
            fi
          done < npm-packages/publish-order.txt
