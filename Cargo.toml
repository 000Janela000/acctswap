[workspace]
resolver = "3"
members = ["crates/acctswap-core", "crates/acctswap"]

[workspace.package]
version = "0.2.2"
edition = "2024"
rust-version = "1.89"          # std File::lock
license = "MIT OR Apache-2.0"
repository = "https://github.com/000Janela000/acctswap"
keywords = ["claude-code", "account", "switch", "cli"]
categories = ["command-line-utilities"]

[workspace.dependencies]
serde_json = { version = "1", default-features = false, features = ["std", "preserve_order"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
